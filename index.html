<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Biologia - Trilha Completa Integrada</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #131F24; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        .phone-container { 
            width: 100%; 
            height: 100%; 
            background: #131F24; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
        }

        @media (min-width: 450px) {
            .phone-container {
                max-width: 380px;
                height: 85vh;
                border-radius: 30px;
                border: 8px solid #333;
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            }
        }

        /* MAPA */
        #map-view { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
        .map-header { padding: 15px 20px; display: flex; justify-content: flex-end; background: #131F24; border-bottom: 2px solid #2a3b45; font-weight: bold; font-size: 16px; color: #ff4b4b; flex-shrink: 0; }
        .section-banner { background: #ff9600; margin: 15px; border-radius: 12px; padding: 15px; color: white; box-shadow: 0 4px 0 #cc7800; flex-shrink: 0; }
        .section-banner h3 { margin: 0; font-size: 14px; text-transform: uppercase; }
        .section-banner h2 { margin: 5px 0 0 0; font-size: 20px; }
        .path-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding-top: 30px; overflow-y: auto; padding-bottom: 50px; -webkit-overflow-scrolling: touch; }
        
        /* NÓS DA TRILHA */
        .node { width: 65px; height: 65px; border-radius: 50%; background: #2a3b45; border: 5px solid #3a4b55; margin-bottom: 35px; display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 6px 0 #1c2830; transition: all 0.2s; position: relative; z-index: 2; flex-shrink: 0; }
        .node.active { background: #58cc02; border-color: #46a302; box-shadow: 0 6px 0 #3d8c01; animation: pulse 2s infinite; }
        .node.locked { background: #2a3b45; border-color: #3a4b55; color: #557080; box-shadow: 0 6px 0 #1c2830; pointer-events: none; }
        .node.completed { background: #ffc800; border-color: #e5b400; box-shadow: 0 6px 0 #cc9f00; color: white; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* BALÃO FLUTUANTE ESTILO DUOLINGO */
        .duo-popup {
            display: none;
            position: absolute;
            background: #ff9600;
            border-radius: 20px;
            padding: 20px;
            width: 260px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            color: white;
            z-index: 100;
            text-align: left;
            animation: popUpAnim 0.2s ease-out;
            border: 3px solid #e08500;
        }
        .duo-popup::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 12px 12px 12px;
            border-style: solid;
            border-color: transparent transparent #ff9600 transparent;
        }
        .duo-popup h3 { margin: 0 0 8px 0; font-size: 17px; font-weight: bold; }
        .duo-popup p { margin: 0 0 15px 0; font-size: 13px; line-height: 1.4; opacity: 0.95; }
        .duo-popup-btn {
            background: white;
            color: #ff9600;
            border: none;
            border-bottom: 4px solid #dcdcdc;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            text-align: center;
        }
        .duo-popup-btn:active { border-bottom-width: 0px; transform: translateY(4px); }
        @keyframes popUpAnim { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* TELA DE CARREGAMENTO ANIMADA */
        #loading-view { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; background: #131F24; text-align: center; padding: 0 20px; box-sizing: border-box; }
        .cell-animation { width: 140px; height: 140px; background: rgba(88, 204, 2, 0.1); border: 4px solid #58cc02; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; position: relative; animation: morph 5s ease-in-out infinite; margin-bottom: 30px; box-shadow: 0 0 25px rgba(88, 204, 2, 0.2) inset; }
        .nucleus { position: absolute; top: 25%; left: 20%; width: 50px; height: 50px; background: rgba(88, 204, 2, 0.4); border: 2px solid #58cc02; border-radius: 50%; animation: float-inner 4s ease-in-out infinite alternate; display: flex; justify-content: center; align-items: center; }
        .nucleolus { width: 18px; height: 18px; background: #58cc02; border-radius: 50%; }
        .mitochondria { position: absolute; width: 28px; height: 14px; border: 2px solid #58cc02; border-radius: 10px; background: rgba(88, 204, 2, 0.2); animation: float-inner 5s ease-in-out infinite alternate-reverse; }
        .mitochondria::after { content: ''; position: absolute; top: 3px; left: 4px; right: 4px; bottom: 3px; border-top: 2px solid #58cc02; border-bottom: 2px solid #58cc02; border-radius: 50%; }
        .m1 { top: 65%; left: 55%; transform: rotate(45deg); }
        .m2 { top: 20%; left: 65%; transform: rotate(-20deg); }
        .ribosomes { position: absolute; width: 4px; height: 4px; background: #58cc02; border-radius: 50%; box-shadow: 15px 5px #58cc02, 25px -15px #58cc02, 8px -25px #58cc02, 45px 15px #58cc02, 35px 35px #58cc02, 10px 45px #58cc02; top: 40%; left: 30%; animation: float-inner 6s linear infinite; opacity: 0.8; }
        @keyframes morph { 0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: scale(1) rotate(0deg); } 50% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; transform: scale(1.02) rotate(5deg); } }
        @keyframes float-inner { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(4px) rotate(5deg); } }
        .loading-text { font-size: 20px; font-weight: bold; color: #58cc02; margin-bottom: 10px; }
        .loading-subtext { font-size: 13px; color: #a9a9a9; font-style: italic; line-height: 1.4; padding: 0 10px; }

        /* LIÇÃO COM ROLAGEM ESTILO DUOLINGO */
        #lesson-view { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            width: 100%; 
            background: white; 
            position: relative; 
            box-sizing: border-box; 
        }
        .lesson-header { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0; 
            background: white; 
            z-index: 10; 
        }
        .progress-bar { flex-grow: 1; height: 14px; background: #e0e0e0; border-radius: 7px; margin: 0 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: #58cc02; width: 0%; transition: width 0.4s ease-out; }
        
        /* Área de conteúdo rolável de forma fluida */
                .lesson-content { 
            padding: 10px 20px 120px 20px; 
            flex-grow: 1; 
            min-height: 0; /* Correção essencial para ativar a rolagem no celular/Netlify */
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            box-sizing: border-box; 
        }
        .lesson-title { color: #3c3c3c; font-size: 20px; margin-top: 0; margin-bottom: 12px; }
        .lesson-text { color: #555; font-size: 14px; line-height: 1.5; background: #f0f4f8; padding: 12px; border-radius: 12px; border-left: 5px solid #1cb0f6; margin-bottom: 12px; }
        .lesson-img { width: 100%; max-height: 130px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; border: 1px solid #ddd; }
        .options { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .option-btn { background: white; border: 2px solid #e5e5e5; border-bottom-width: 4px; border-radius: 16px; padding: 12px; font-size: 14px; font-weight: bold; color: #4b4b4b; cursor: pointer; text-align: left; transition: all 0.1s; }
        .option-btn.selected { background: #d7ffb8; border-color: #58cc02; color: #2b7000; }
        
        /* Rodapé fixo na parte inferior */
        .lesson-footer { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            padding: 20px; 
            box-sizing: border-box; 
            border-top: 1px solid #eee; 
            background: white; 
            display: flex; 
            justify-content: flex-end; 
            z-index: 301; 
        }
        .action-btn { background: #58cc02; border: none; border-bottom: 4px solid #46a302; color: white; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 16px; cursor: pointer; width: 100%; text-transform: uppercase; }
        .action-btn:disabled { background: #e5e5e5; border-bottom-color: #cecece; color: #afafaf; cursor: not-allowed; }
        .action-btn.info-btn { background: #1cb0f6; border-bottom-color: #1899d6; }

        /* PAINEL DE FEEDBACK ESTILO DUOLINGO COM ANIMAÇÃO */
        .feedback-container {
            display: none;
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            padding: 20px 24px;
            z-index: 300;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            animation: slideUpPanel 0.25s ease-out;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
        }
        .feedback-container.correct {
            background-color: #d7ffb8;
            border-top: 5px solid #58cc02;
        }
        .feedback-container.incorrect {
            background-color: #ffdfe0;
            border-top: 5px solid #ff4b4b;
        }
        .feedback-header {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .feedback-container.correct .feedback-header { color: #2b7000; }
        .feedback-container.incorrect .feedback-header { color: #ea2b2b; }
        
        .feedback-body {
            font-size: 15px;
            font-weight: 600;
        }
        .feedback-container.correct .feedback-body { color: #3c8c00; }
        .feedback-container.incorrect .feedback-body { color: #d32f2f; }

        @keyframes slideUpPanel {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- MAPA -->
        <div id="map-view">
            <div class="map-header"><span id="map-lives">❤️ 5</span></div>
            <div class="section-banner">
                <h3>Seção 1, Módulo 1</h3>
                <h2>Introdução à Biologia</h2>
            </div>
            
            <div class="path-container">
                <div class="node active" id="node-1" onclick="openPreview(1, event)" style="margin-left: 0px;">1</div>
                <div class="node locked" id="node-2" onclick="openPreview(2, event)" style="margin-left: 70px;">2</div>
                <div class="node locked" id="node-3" onclick="openPreview(3, event)" style="margin-right: 60px;">3</div>
                <div class="node locked" id="node-4" onclick="openPreview(4, event)" style="margin-left: 30px;">4</div>
                <div class="node locked" id="node-5" onclick="openPreview(5, event)" style="margin-left: -50px;">👑</div>
            </div>

            <div id="duo-card" class="duo-popup">
                <h3 id="pop-title">Título da Aula</h3>
                <p id="pop-desc">Descrição da aula.</p>
                <button class="duo-popup-btn" onclick="startLoadingAndLesson()">CONTINUAR</button>
            </div>
        </div>

        <!-- TELA DE CARREGAMENTO ANIMADA -->
        <div id="loading-view">
            <div class="cell-animation">
                <div class="nucleus"><div class="nucleolus"></div></div>
                <div class="mitochondria m1"></div>
                <div class="mitochondria m2"></div>
                <div class="ribosomes"></div>
            </div>
            <div class="loading-text">Estamos preparando tudo</div>
            <div class="loading-subtext" id="quote-container">...</div>
        </div>

        <!-- LIÇÃO -->
        <div id="lesson-view">
            <div class="lesson-header">
                <span style="cursor: pointer; font-weight: bold; color: #afafaf; font-size: 20px;" onclick="quitLesson()">✕</span>
                <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
                <span style="font-weight: bold; color: #ff4b4b; font-size: 16px;" id="lesson-lives">❤️ 5</span>
            </div>
            <div class="lesson-content" id="quiz-container"></div>
            <div id="feedback-area" class="feedback-container"></div>
            <div class="lesson-footer">
                <button class="action-btn" id="next-btn" onclick="handleNextClick()" disabled>VERIFICAR</button>
            </div>
        </div>
    </div>

    <script>
        let lives = 5;
        let currentStep = 0;
        let selectedOption = null;
        let answered = false;
        let lessonSteps = [];
        let currentNodePlaying = 1;
        let errorsInSession = 0;

        const biologyQuotes = [
            '"A ciência não é apenas compatível com a espiritualidade; é uma fonte profunda de espiritualidade."<br><br>— Carl Sagan',
            '"Na natureza, nada existe sozinho."<br><br>— Rachel Carson',
            '"A vida é uma simbiose cooperativa que requer compreensão."<br><br>— Lynn Margulis'
        ];

        const previewData = {
            1: { title: "Lição 1 de 5", desc: "O que é uma célula: entenda o conceito fundamental da vida e microscopia." },
            2: { title: "Lição 2 de 5", desc: "Estrutura da Membrana e Proteínas: barreiras e transporte celular." },
            3: { title: "Lição 3 de 5", desc: "Organelas e Mitocôndrias: as fábricas de energia (ATP) da célula." },
            4: { title: "Lição 4 de 5", desc: "Metabolismo Celular: vias de catabolismo e anabolismo." },
            5: { title: "Avaliação Final", desc: "Revisão interativa em conversa e prova final para conquistar sua coroa!" }
        };

        function formatTextWithBold(text) {
            const keywords = [
                "célula", "células", "membrana plasmática", "proteínas", "proteína", 
                "mitocôndrias", "mitocôndria", "núcleo", "citoplasma", "ATP", 
                "catabolismo", "anabolismo", "metabolismo", "lipídios", "DNA", "organelas"
            ];
            let formatted = text;
            keywords.forEach(keyword => {
                const regex = new RegExp(`\\b(${keyword})\\b`, 'gi');
                formatted = formatted.replace(regex, '<b>$1</b>');
            });
            return formatted;
        }

        const structuredLessons = {
            1: [
                { type: "info", title: "O Conceito de Célula", text: "A célula é a menor unidade básica estrutural e funcional de todos os seres vivos. Ela possui compartimentos internos que mantêm a vida ativa.", img: "https://images.unsplash.com/photo-1530497610245-94d3c16cda28?auto=format&fit=crop&w=400&q=80" },
                { type: "info", title: "A Origem da Vida", text: "Enquanto o átomo é a menor unidade da matéria química, a célula é a menor estrutura capaz de manifestar propriedades vitais complexas como reprodução e metabolismo.", img: "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&w=400&q=80" },
                { type: "quiz", title: "Com base na explicação acima, qual é a definição correta de célula?", options: ["A menor unidade estrutural e funcional da vida", "Um tipo isolado de metal pesado", "Uma molécula simples de água pura"], correct: 0 },
                { type: "quiz", title: "Qual a diferença fundamental entre átomos e células descrita nas telas?", options: ["Átomos manifestam vida própria e células não", "Células são capazes de manifestar propriedades vitais, enquanto átomos são unidades fundamentais da matéria", "Ambos possuem exatamente a mesma complexidade biológica"], correct: 1 },
                { type: "quiz", title: "Qual das alternativas abaixo melhor descreve a função geral das células?", options: ["Apenas acumular poeira microscópica", "Formar a base estrutural e funcional de todos os seres vivos", "Conduzir eletricidade em fios metálicos"], correct: 1 }
            ],
            2: [
                { type: "info", title: "A Membrana Plasmática", text: "A membrana plasmática é a película flexível que envolve e protege a célula. Ela regula rigorosamente a entrada e saída de substâncias do meio interno através da permeabilidade seletiva.", img: "https://images.unsplash.com/photo-1579165466941-2f91e65f74cb?auto=format&fit=crop&w=400&q=80" },
                { type: "info", title: "O Papel das Proteínas", text: "Embutidas na membrana, encontramos as proteínas. Elas atuam como portais de transporte seletivo e receptores de sinais químicos fundamentais para a comunicação celular.", img: "https://images.unsplash.com/photo-1530497610245-94d3c16cda28?auto=format&fit=crop&w=400&q=80" },
                { type: "quiz", title: "Conforme explicado nas telas acima, qual é a função das proteínas na membrana plasmática?", options: ["Fazer a fotossíntese nas folhas", "Atuar como portais de transporte e reconhecimento químico", "Produzir todo o DNA da célula"], correct: 1 },
                { type: "quiz", title: "O que a propriedade de 'permeabilidade seletiva' da membrana plasmática realiza?", options: ["Bloqueia absolutamente qualquer substância", "Controla de forma rigorosa a entrada e saída de moléculas", "Gera energia solar diretamente"], correct: 1 },
                { type: "quiz", title: "As proteínas estruturais da membrana ajudam a célula em quê?", options: ["Comunicação externa e transporte seletivo", "Absorção direta de calor solar", "Rigidez total de ossos"], correct: 0 }
            ],
            3: [
                { type: "info", title: "As Mitocôndrias e a Energia", text: "As mitocôndrias são organelas citoplasmáticas responsáveis pela respiração celular. Elas convertem nutrientes e oxigênio em ATP (adenosina trifosfato), que é a moeda energética da célula.", img: "https://images.unsplash.com/photo-1507668077129-56e32842fceb?auto=format&fit=crop&w=400&q=80" },
                { type: "info", title: "Respiração Celular Ativa", text: "Sem as mitocôndrias trabalhando intensamente no citoplasma, as células perderiam a capacidade de manter seus processos vitais funcionando dia e noite.", img: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=400&q=80" },
                { type: "quiz", title: "De acordo com o texto, qual é o papel principal das mitocôndrias?", options: ["Realizar a respiração celular e produzir energia (ATP)", "Armazenar o núcleo celular", "Construir a parede rígida externa"], correct: 0 },
                { type: "quiz", title: "Qual molécula é gerada nas mitocôndrias para abastecer as necessidades energéticas celulares?", options: ["DNA", "ATP", "Clorofila"], correct: 1 },
                { type: "quiz", title: "Onde ficam localizadas as mitocôndrias na estrutura celular?", options: ["No citoplasma", "Dentro do núcleo rígido", "Na parede externa da membrana"], correct: 0 }
            ],
            4: [
                { type: "info", title: "O Metabolismo Celular", text: "O metabolismo engloba reações químicas divididas em catabolismo (quebra de moléculas grandes para liberar energia) e anabolismo (construção de compostos complexos usando energia).", img: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=400&q=80" },
                { type: "info", title: "Balanço Energético", text: "Essas vias metabólicas garantem que o corpo gerencie perfeitamente os nutrientes que consumimos a cada instante.", img: "https://images.unsplash.com/photo-1530497610245-94d3c16cda28?auto=format&fit=crop&w=400&q=80" },
                { type: "quiz", title: "Baseando-se na explicação de metabolismo, o que faz o catabolismo?", options: ["Sintetiza novas proteínas complexas", "Quebra moléculas para liberar energia", "Congela as reações da célula"], correct: 1 },
                { type: "quiz", title: "O que caracteriza o processo de anabolismo celular?", options: ["A degradação completa de nutrientes", "A construção e síntese de compostos complexos", "A eliminação de água pura"], correct: 1 },
                { type: "quiz", title: "As reações metabólicas totais da célula englobam quais processos?", options: ["Apenas respiração noturna", "Catabolismo e anabolismo integrados", "Somente fotossíntese animal"], correct: 1 }
            ],
            5: [
                { type: "info", title: "💬 Conversa de Revisão", text: "<b>Professor:</b> Olá! Vamos recapitular nossa jornada até aqui. Lembra quando falamos que a <b>célula</b> é a menor unidade funcional da vida?<br><br><b>Aluno:</b> Sim! Aprendi que ela abriga toda a complexidade biológica básica.", img: "https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&w=400&q=80" },
                { type: "info", title: "💬 Conversa de Revisão", text: "<b>Professor:</b> Exatamente. E sobre a proteção e o motor da célula, o que você lembra?<br><br><b>Aluno:</b> A <b>membrana plasmática</b> usa suas <b>proteínas</b> para transporte seletivo, e as <b>mitocôndrias</b> produzem todo o <b>ATP</b> necessário!", img: "https://images.unsplash.com/photo-1507668077129-56e32842fceb?auto=format&fit=crop&w=400&q=80" },
                { type: "quiz", title: "[Avaliação] Qual estrutura celular protege o conteúdo interno e contém proteínas transportadoras?", options: ["Membrana plasmática", "Ribossomo livre", "Molécula de glicose"], correct: 0 },
                { type: "quiz", title: "[Avaliação] Qual organela estudada é responsável pela geração de energia (ATP) celular?", options: ["Mitocôndria", "Complexo de Golgi", "Citoplasma gelatinoso"], correct: 0 },
                { type: "quiz", title: "[Avaliação] Qual é a menor unidade funcional capaz de manifestar a vida de forma autônoma?", options: ["O átomo isolado", "A célula", "A molécula de água"], correct: 1 },
                { type: "quiz", title: "[Avaliação] Como se chama o processo metabólico de síntese de moléculas complexas?", options: ["Catabolismo", "Anabolismo", "Osmose passiva"], correct: 1 }
            ]
        };

        function openPreview(nodeId, event) {
            currentNodePlaying = nodeId;
            const data = previewData[nodeId];
            const card = document.getElementById('duo-card');
            
            document.getElementById('pop-title').innerText = data.title;
            document.getElementById('pop-desc').innerText = data.desc;

            const rect = event.target.getBoundingClientRect();
            const containerRect = document.querySelector('.phone-container').getBoundingClientRect();
            
            let topPos = rect.bottom - containerRect.top + 10;
            let leftPos = (rect.left + rect.right) / 2 - containerRect.left - 130;

            if (leftPos < 10) leftPos = 10;
            if (leftPos > 90) leftPos = 90;

            card.style.top = `${topPos}px`;
            card.style.left = `${leftPos}px`;
            card.style.display = 'block';
        }

        document.getElementById('map-view').addEventListener('click', function(e) {
            if (!e.target.classList.contains('node') && !e.target.closest('#duo-card')) {
                document.getElementById('duo-card').style.display = 'none';
            }
        });

        function startLoadingAndLesson() {
            document.getElementById('duo-card').style.display = 'none';
            errorsInSession = 0;
            
            const randomQuote = biologyQuotes[Math.floor(Math.random() * biologyQuotes.length)];
            document.getElementById('quote-container').innerHTML = randomQuote;

            document.getElementById('map-view').style.display = 'none';
            document.getElementById('loading-view').style.display = 'flex';

            setTimeout(() => {
                let rawSteps = structuredLessons[currentNodePlaying];
                let formattedSteps = rawSteps.map(step => {
                    if(step.type === "info") {
                        return { ...step, text: formatTextWithBold(step.text) };
                    }
                    return step;
                });

                lessonSteps = [...formattedSteps, { type: "reward", title: "Módulo Concluído!", text: "Excelente! Você concluiu todas as etapas e conquistou sua coroa." }];
                
                document.getElementById('loading-view').style.display = 'none';
                document.getElementById('lesson-view').style.display = 'flex';
                
                currentStep = 0;
                renderStep();
            }, 1800);
        }

        function quitLesson() {
            errorsInSession = 0;
            document.getElementById('map-view').style.display = 'flex';
            document.getElementById('lesson-view').style.display = 'none';
        }

        function completeAndUnlockNext() {
            const totalQuestions = lessonSteps.filter(s => s.type === "quiz").length;
            
            if (totalQuestions > 0 && errorsInSession >= Math.ceil(totalQuestions / 2)) {
                alert(`⚠️ Você errou ${errorsInSession} de ${totalQuestions} questões. Refaça a seção para fixar melhor o conteúdo!`);
                quitLesson();
                return;
            }

            const currentBtn = document.getElementById(`node-${currentNodePlaying}`);
            if (currentBtn) {
                currentBtn.classList.remove('active');
                currentBtn.classList.add('completed');
                currentBtn.innerHTML = currentNodePlaying === 5 ? '👑' : '⭐'; 
            }

            const nextBtn = document.getElementById(`node-${currentNodePlaying + 1}`);
            if (nextBtn) {
                nextBtn.classList.remove('locked');
                nextBtn.classList.add('active');
            }

            quitLesson();
        }

        function renderStep() {
            const container = document.getElementById('quiz-container');
            const progressFill = document.getElementById('progress');
            const nextBtn = document.getElementById('next-btn');
            const feedbackArea = document.getElementById('feedback-area');
            
            feedbackArea.style.display = 'none';
            selectedOption = null;
            answered = false;

            const step = lessonSteps[currentStep];
            progressFill.style.width = `${(currentStep / (lessonSteps.length - 1)) * 100}%`;

            if (step.type === "info") {
                let imgHtml = step.img ? `<img src="${step.img}" class="lesson-img" alt="Ilustração biológica temática">` : '';
                container.innerHTML = `<h2 class="lesson-title">${step.title}</h2>${imgHtml}<div class="lesson-text">${step.text}</div>`;
                nextBtn.innerText = "ENTENDI";
                nextBtn.className = "action-btn info-btn";
                nextBtn.disabled = false;
            } else if (step.type === "quiz") {
                let html = `<h2 class="lesson-title">${step.title}</h2><div class="options">`;
                step.options.forEach((opt, idx) => {
                    html += `<button class="option-btn" onclick="selectOption(${idx}, this)">${opt}</button>`;
                });
                container.innerHTML = html + `</div>`;
                nextBtn.innerText = "VERIFICAR";
                nextBtn.className = "action-btn";
                nextBtn.disabled = true;
            } else {
                container.innerHTML = `<div style="text-align:center; margin-top:30px;"><h1 style="font-size: 50px; margin: 0;">👑</h1><h2 class="lesson-title">${step.title}</h2><p style="color:#666; margin-top:10px; font-size:14px;">${step.text}</p></div>`;
                nextBtn.innerText = "FINALIZAR";
                nextBtn.className = "action-btn";
                nextBtn.disabled = false;
            }
        }

        function selectOption(idx, el) {
            if (answered) return;
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedOption = idx;
            document.getElementById('next-btn').disabled = false;
        }

        function handleNextClick() {
            const step = lessonSteps[currentStep];
            if (step.type === "info") {
                currentStep++; renderStep();
            } else if (step.type === "quiz") {
                if (!answered) checkAnswer();
                else { currentStep++; renderStep(); }
            } else {
                completeAndUnlockNext();
            }
        }

        function checkAnswer() {
            const step = lessonSteps[currentStep];
            const feedbackArea = document.getElementById('feedback-area');
            const nextBtn = document.getElementById('next-btn');

            answered = true;
            feedbackArea.style.display = 'block';

            if (selectedOption === step.correct) {
                feedbackArea.className = "feedback-container correct";
                feedbackArea.innerHTML = `
                    <div class="feedback-header">✨ Excelente!</div>
                    <div class="feedback-body">Você acertou a questão com precisão.</div>
                `;
                nextBtn.innerText = "CONTINUAR";
                nextBtn.style.background = "#58cc02";
                nextBtn.style.borderColor = "#46a302";
            } else {
                lives--;
                errorsInSession++;
                document.getElementById('lesson-lives').innerText = `❤️ ${lives}`;
                document.getElementById('map-lives').innerText = `❤️ ${lives}`;
                
                feedbackArea.className = "feedback-container incorrect";
                feedbackArea.innerHTML = `
                    <div class="feedback-header">❌ Resposta incorreta</div>
                    <div class="feedback-body">A resposta certa era: <b>${step.options[step.correct]}</b></div>
                `;
                nextBtn.innerText = "ENTENDI";
                nextBtn.style.background = "#ff4b4b";
                nextBtn.style.borderColor = "#ea2b2b";
                
                if (lives <= 0) {
                    alert("Você ficou sem vidas! Voltando para o mapa...");
                    lives = 5;
                    document.getElementById('lesson-lives').innerText = `❤️ ${lives}`;
                    document.getElementById('map-lives').innerText = `❤️ ${lives}`;
                    quitLesson();
                }
            }
        }
    </script>
</body>
</html>
